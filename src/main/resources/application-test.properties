# src/main/resources/application-test.properties
server.port=${SERVER_PORT:8761}

eureka.instance.hostname=${EUREKA_HOSTNAME:eureka-server-test}
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://${spring.security.user.name}:${spring.security.user.password}@${eureka.instance.hostname}:${server.port}/eureka/
eureka.server.enable-self-preservation=false
eureka.server.eviction-interval-timer-in-ms=5000
eureka.server.response-cache-update-interval-ms=3000

# no default: CI must inject these, startup fails fast otherwise
spring.security.user.name=${EUREKA_DASHBOARD_USERNAME}
spring.security.user.password=${EUREKA_DASHBOARD_PASSWORD}

logging.level.root=INFO
logging.level.com.clickkart=INFO
logging.level.com.netflix.eureka=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{correlationId:--}] %-5level %logger{36} - %msg%n
