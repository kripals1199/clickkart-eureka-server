# src/main/resources/application-prod.properties
server.port=${SERVER_PORT:8761}

eureka.instance.hostname=${EUREKA_HOSTNAME}
# HA cluster: each replica's peer URL list must include the OTHER replicas so the
# registry survives a single node failure. EUREKA_PEER_URLS is required - no
# single-node fallback in prod.
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_PEER_URLS}
eureka.server.enable-self-preservation=true
eureka.server.eviction-interval-timer-in-ms=10000

spring.security.user.name=${EUREKA_DASHBOARD_USERNAME}
spring.security.user.password=${EUREKA_DASHBOARD_PASSWORD}

management.endpoint.health.show-details=when-authorized

logging.level.root=WARN
logging.level.com.clickkart=WARN
logging.structured.format.console=ecs
