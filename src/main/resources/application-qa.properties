# src/main/resources/application-qa.properties
server.port=${SERVER_PORT:8761}

eureka.instance.hostname=${EUREKA_HOSTNAME:eureka-server-qa}
# register-with-eureka/fetch-registry enabled so multiple QA nodes can peer-replicate;
# a single node simply points its peer URL at itself.
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_PEER_URLS:http://${spring.security.user.name}:${spring.security.user.password}@${eureka.instance.hostname}:${server.port}/eureka/}
eureka.server.enable-self-preservation=true
eureka.server.eviction-interval-timer-in-ms=10000

spring.security.user.name=${EUREKA_DASHBOARD_USERNAME}
spring.security.user.password=${EUREKA_DASHBOARD_PASSWORD}

management.endpoint.health.show-details=when-authorized

logging.level.root=INFO
logging.level.com.clickkart=INFO
logging.level.com.netflix.eureka=WARN
