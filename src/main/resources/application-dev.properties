# src/main/resources/application-dev.properties
server.port=${SERVER_PORT:8761}

eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
eureka.client.service-url.defaultZone=http://${spring.security.user.name}:${spring.security.user.password}@${eureka.instance.hostname}:${server.port}/eureka/
eureka.server.enable-self-preservation=false
# Confirmed real bug, found via an actual docker-compose run: these were previously set to
# 500000000000000000 (18 digits - ~500 quintillion ms, i.e. "never refresh") instead of a
# sane millisecond value. eureka.server.response-cache-update-interval-ms backs the read-only
# response cache that GET /eureka/apps (and every client DiscoveryClient's registry fetch) is
# served from - with that cache never refreshing past its first (empty, pre-registration)
# snapshot, EVERY service's service-discovery lookup silently saw zero instances forever, even
# though registration itself succeeded and the underlying registry (and the HTML dashboard,
# which reads it directly) was correct the whole time. Fixed to the same sensible, fast-feedback
# values already used in the test profile.
eureka.server.eviction-interval-timer-in-ms=5000
eureka.server.response-cache-update-interval-ms=3000

spring.security.user.name=${EUREKA_DASHBOARD_USERNAME:admin}
# dev-only fallback secret - never rely on this default outside a local machine
spring.security.user.password=${EUREKA_DASHBOARD_PASSWORD:dev-only-secret-change-me}

management.endpoint.health.show-details=always

logging.level.root=INFO
logging.level.com.clickkart=DEBUG
logging.level.com.netflix.eureka=INFO
logging.level.com.netflix.discovery=INFO
